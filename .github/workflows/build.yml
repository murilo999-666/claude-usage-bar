name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: Smoke test
        shell: bash
        run: |
          out=$(echo '{"model":{"display_name":"Opus"},"rate_limits":{"five_hour":{"used_percentage":42}}}' | go run . --no-fetch --plain)
          echo "$out"
          case "$out" in *42%*Opus*) ;; *) echo "unexpected output"; exit 1 ;; esac

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name="claude-usage-bar-$os-$arch"
            if [ "$os" = windows ]; then name="$name.exe"; fi
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" -o "dist/$name" .
          done
          cd dist
          sha256sum claude-usage-bar-* > checksums.txt
          cat checksums.txt
      - uses: actions/attest-build-provenance@v4
        continue-on-error: true
        with:
          subject-path: 'dist/claude-usage-bar-*'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md
